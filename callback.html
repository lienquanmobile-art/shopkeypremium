<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang xác thực...</title>
  <style>
    body { background-color: #0d0f17; color: #00e5ff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00e5ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { color: #ffd700; }
  </style>
</head>
<body>
  <div>
    <div class="loader" id="loader"></div>
    <h2 id="statusText">Đang xác thực vượt link...</h2>
    <p id="subText" style="color: #a0aec0;">Vui lòng đợi trong giây lát!</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCX2uQJsj3HuhNe9N3Dh5vP_9Ga6iYweLM",
      authDomain: "shopblackkeypremium.firebaseapp.com",
      databaseURL: "https://shopblackkeypremium-default-rtdb.firebaseio.com",
      projectId: "shopblackkeypremium",
      storageBucket: "shopblackkeypremium.firebasestorage.app",
      messagingSenderId: "552944431229",
      appId: "1:552944431229:web:6a874f98d12e7ff376c114"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // LẤY TOKEN TỪ LOCALSTORAGE (Đã lưu ở trang redirect.html)
    const token = localStorage.getItem('bypass_token');

    if (token) {
      db.ref(`bypass_tokens/${token}`).update({ status: 'completed' }).then(() => {
        document.getElementById('statusText').textContent = "Xác thực thành công!";
        document.getElementById('subText').textContent = "Bạn có thể quay lại web để nhận thưởng.";
        document.getElementById('loader').style.display = 'none';
        
        localStorage.removeItem('bypass_token'); // Xóa token sau khi dùng xong
        localStorage.removeItem('link4m_target'); // Xóa link đích

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      }).catch(err => {
        document.getElementById('statusText').textContent = "Lỗi xác thực!";
        document.getElementById('subText').textContent = "Vui lòng liên hệ Admin.";
        document.getElementById('loader').style.display = 'none';
      });
    } else {
      document.getElementById('statusText').textContent = "Lỗi!";
      document.getElementById('subText').textContent = "Không tìm thấy mã xác thực. Vui lòng thực hiện lại từ đầu.";
      document.getElementById('loader').style.display = 'none';
    }
  </script>
</body>
</html>
