<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng...</title>
  <style>
    body { background-color: #0d0f17; color: #00e5ff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00e5ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="loader"></div>
    <h2>Đang chuyển hướng đến Link4m...</h2>
    <p>Vui lòng đợi!</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (token) {
      // Lưu token vào localStorage để callback có thể lấy lại
      localStorage.setItem('bypass_token', token);
      
      // Link4m thật của bạn
      const LINK4M_URL = "https://link4m.org/8K8u1L"; 
      
      setTimeout(() => {
        window.location.href = LINK4M_URL;
      }, 1000);
    } else {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
